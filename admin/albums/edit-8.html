    <!-- MAIN CONTENT -->
    <div class="main-content">
        <div class="top-navbar">
            <h5 class="page-title">Edit Album</h5>
            <div class="d-flex align-items-center gap-3">
                <a href="../../index.html" target="_blank" class="text-decoration-none" style="color: var(--gray); font-size: 13px;">
                    <i class="bi bi-globe me-1"></i> Visit Website
                </a>

                <div class="btn-logout-form">
                    <button type="button" class="btn-logout" id="adminLogout" data-href="../login.html">
                        <i class="bi bi-box-arrow-right"></i> Logout
                    </button>
                </div>

                <div class="top-avatar">A</div>
            </div>
        </div>

        <div class="p-4">
<div class="container-fluid">
    <div class="card">
        <div class="card-header ">
            <h5 class="mb-0">Edit Album: Aashiqui 2</h5>
        </div>
        <div class="card-body">
            <form data-mock="Album updated (demo only — nothing is stored)." data-redirect="index.html">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Album Name <span class="text-danger">*</span></label>
                        <input type="text" name="album_name" class="form-control" value="Aashiqui 2" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Artist <span class="text-danger">*</span></label>
                        <select name="album_artist_id" class="form-control" required>
                            <option value="">Select Artist</option><option value="1">Atif Aslam</option><option value="2">Ali Zafar</option><option value="3">Rahat Fateh Ali Khan</option><option value="4">Taylor Swift</option><option value="5">Ed Sheeran</option><option value="6">Billie Eilish</option><option value="7">Shakira</option><option value="8" selected>Arijit Singh</option><option value="9">Shreya Ghoshal</option><option value="10">Marshmello</option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Release Year <span class="text-danger">*</span></label>
                        <input type="text" name="album_release_year" class="form-control" value="2013" placeholder="2024" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Cover Image Path</label>
                        <input type="text" name="album_cover_image" class="form-control" value="albums/aashiqui-2.jpg" placeholder="images/album.jpg">
                    </div>
                    <div class="col-md-12 mb-3">
                        <label class="form-label">Description</label>
                        <textarea name="album_description" class="form-control" rows="3">Soundtrack of the movie Aashiqui 2 featuring &quot;Tum Hi Ho&quot;.</textarea>
                    </div>
                </div>

                <div class="mt-3">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> Update
                    </button>
                    <a href="index.html" class="btn btn-secondary">
                        <i class="fas fa-arrow-left"></i> Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
        </div>
    </div>
