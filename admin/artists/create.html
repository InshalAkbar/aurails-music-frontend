<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="../../favicon.ico">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../../assets/css/admin/master.css">
    <link rel="stylesheet" href="../../assets/css/admin/artists.css">
</head>
<body>

    <!-- SIDEBAR -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h4 class="brand-title">
                <i class="bi bi-wave-square"></i> AURAILS PANEL
            </h4>
        </div>

        <div class="nav-links">
            <a href="../dashboard.html"
               class="nav-link-admin">
                <i class="bi bi-speedometer2"></i> Dashboard
            </a>

            <div class="nav-group-label">Music Management</div>

            <a href="../artists/index.html"
               class="nav-link-admin active">
                <i class="bi bi-mic"></i> Artists
            </a>

            <a href="../albums/index.html"
               class="nav-link-admin">
                <i class="bi bi-journal-album"></i> Albums
            </a>

            <a href="../genres/index.html"
               class="nav-link-admin">
                <i class="bi bi-tags"></i> Genres
            </a>

            <a href="../languages/index.html"
               class="nav-link-admin">
                <i class="bi bi-translate"></i> Languages
            </a>

            <a href="../music/index.html"
               class="nav-link-admin">
                <i class="bi bi-music-note-beamed"></i> Music Track
            </a>

            <a href="../videos/index.html"
               class="nav-link-admin">
                <i class="bi bi-camera-video"></i> Videos
            </a>

            <div class="nav-group-label">Community</div>

            <a href="../reviews/index.html"
               class="nav-link-admin">
                <i class="bi bi-star"></i> Reviews
            </a>

            <a href="../users/index.html"
               class="nav-link-admin">
                <i class="bi bi-people"></i> Users
            </a>

            <div class="nav-group-label">System</div>

            <a href="../settings.html"
               class="nav-link-admin">
                <i class="bi bi-gear"></i> Settings
            </a>

        </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-content">
        <div class="top-navbar">
            <h5 class="page-title">Add New Artist</h5>
            <div class="d-flex align-items-center gap-3">
                <a href="../../index.html" target="_blank" class="text-decoration-none" style="color: var(--gray); font-size: 13px;">
                    <i class="bi bi-globe me-1"></i> Visit Website
                </a>

                <div class="btn-logout-form">
                    <button type="button" class="btn-logout" id="adminLogout" data-href="../login.html">
                        <i class="bi bi-box-arrow-right"></i> Logout
                    </button>
                </div>

                <div class="top-avatar">A</div>
            </div>
        </div>

        <div class="p-4">
<div class="container-fluid">
    <div class="card">
        <div class="card-header ">
            <h5 class="mb-0">Add New Artist</h5>
        </div>
        <div class="card-body">
            <form data-mock="Artist saved (demo only — nothing is stored)." data-redirect="index.html">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Artist Name <span class="text-danger">*</span></label>
                        <input type="text" name="artist_name" class="form-control" placeholder="e.g. Atif Aslam" value="" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Artist Image URL</label>
                        <input type="url" name="artist_image" class="form-control" placeholder="https://example.com/artist.jpg" value="">
                        <small class="text-muted">Direct link for the profile picture (JPG/PNG).</small>
                    </div>

                    <div class="col-md-12 mb-3">
                        <label class="form-label">Artist Biography</label>
                        <textarea name="artist_bio" class="form-control" rows="4" placeholder="Write a short biography about the artist..."></textarea>
                    </div>
                </div>

                <div class="mt-3">
                    <button type="submit" class="btn btn-success">
                        <i class="fas fa-save"></i> Save
                    </button>
                    <a href="index.html" class="btn btn-secondary">
                        <i class="fas fa-arrow-left"></i> Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/data.js"></script>
    <script src="../../assets/js/main.js"></script>
    <script src="../../assets/js/admin.js"></script>
</body>
</html>
