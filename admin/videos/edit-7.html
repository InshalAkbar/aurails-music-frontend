    <!-- MAIN CONTENT -->
    <div class="main-content">
        <div class="top-navbar">
            <h5 class="page-title">Edit Video</h5>
            <div class="d-flex align-items-center gap-3">
                <a href="../../index.html" target="_blank" class="text-decoration-none" style="color: var(--gray); font-size: 13px;">
                    <i class="bi bi-globe me-1"></i> Visit Website

                <div class="btn-logout-form">
                    <button type="button" class="btn-logout" id="adminLogout" data-href="../login.html">

                    </button>
                </div>

                <div class="top-avatar">A</div>
            </div>
        </div>

        <div class="p-4">
<div class="container-fluid">
    <div class="card">
        <div class="card-header ">
            <h5 class="mb-0">Edit Video: Tum Hi Ho - Arijit Singh</h5>
        </div>
        <div class="card-body">
            <form data-mock="Video updated (demo only — nothing is stored)." data-redirect="index.html">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Title <span class="text-danger">*</span></label>
                        <input type="text" name="video_title" class="form-control" value="Tum Hi Ho - Arijit Singh" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Artist <span class="text-danger">*</span></label>
                        <select name="video_artist_id" class="form-control" required>
                            <option value="">Select Artist</option><option value="1">Atif Aslam</option><option value="2">Ali Zafar</option><option value="3">Rahat Fateh Ali Khan</option><option value="4">Taylor Swift</option><option value="5">Ed Sheeran</option><option value="6">Billie Eilish</option><option value="7">Shakira</option><option value="8" selected>Arijit Singh</option><option value="9">Shreya Ghoshal</option><option value="10">Marshmello</option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Album</label>
                        <select name="video_album_id" class="form-control">
                            <option value="">Select Album</option><option value="1">Doorie</option><option value="2">Meri Kahani</option><option value="3">Qawwali &amp; More</option><option value="4">1989</option><option value="5">Divide</option><option value="6">Happier Than Ever</option><option value="7">Oral Fixation</option><option value="8" selected>Aashiqui 2</option><option value="9">Ghoomar</option><option value="10">Joytime</option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Genre</label>
                        <select name="video_genre_id" class="form-control">
                            <option value="">Select Genre</option><option value="1" selected>Pop</option><option value="2">Rock</option><option value="3">Classical</option><option value="4">Jazz</option><option value="5">Hip Hop</option><option value="6">Electronic</option><option value="7">R&amp;B</option><option value="8">Country</option><option value="9">Folk</option><option value="10">Blues</option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Language</label>
                        <select name="video_language_id" class="form-control">
                            <option value="">Select Language</option><option value="1">Urdu</option><option value="2">English</option><option value="3" selected>Hindi</option><option value="4">Punjabi</option><option value="5">Arabic</option><option value="6">Spanish</option><option value="7">French</option><option value="8">Turkish</option><option value="9">Korean</option><option value="10">Japanese</option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Year</label>
                        <input type="text" name="video_year" class="form-control" value="2013" placeholder="2024">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Duration</label>
                        <input type="text" name="video_duration" class="form-control" value="4:22" placeholder="3:45">
                    </div>
                    <div class="col-md-12 mb-3">
                        <label class="form-label">Description</label>
                        <textarea name="video_description" class="form-control" rows="3">Official video of &quot;Tum Hi Ho&quot;.</textarea>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">File Path</label>
                        <input type="text" name="video_file_path" class="form-control" value="" placeholder="videos/video.mp4">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">YouTube Video ID</label>
                        <input type="text" name="video_youtube_id" class="form-control" value="Umqb9KENgmk" placeholder="e.g. dQw4w9WgXcQ"><small class="text-muted">YouTube URL se video ID copy karo (watch?v= ke baad wali)</small>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Thumbnail Path</label>
                        <input type="text" name="video_image_path" class="form-control" value="videos/tum-hi-ho-thumb.jpg" placeholder="videos/thumbnail.jpg">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Status</label>
                        <select name="video_is_new" class="form-control">
                            <option value="no" selected>Old</option><option value="yes">New</option>
                        </select>
                    </div>
                </div>

                <div class="mt-3">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> Update
                    </button>
                    <a href="index.html" class="btn btn-secondary">
                        <i class="fas fa-arrow-left"></i> Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
