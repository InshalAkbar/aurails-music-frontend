</head>
<body>

    <!-- SIDEBAR -->

        <div class="sidebar-header">
            <h4 class="brand-title">
                <i class="bi bi-wave-square"></i> AURAILS PANEL
            </h4>
        </div>

        <div class="nav-links">
            <a href="../dashboard.html"
               class="nav-link-admin">
                <i class="bi bi-speedometer2"></i> Dashboard
            </a>

            <div class="nav-group-label">Music Management</div>

            <a href="../artists/index.html"
               class="nav-link-admin">
                <i class="bi bi-mic"></i> Artists
            </a>

            <a href="../albums/index.html"
               class="nav-link-admin">
                <i class="bi bi-journal-album"></i> Albums

            <a href="../genres/index.html"
               class="nav-link-admin">

            </a>

            <div class="nav-group-label">Community</div>

            <a href="../reviews/index.html"
               class="nav-link-admin">
                <i class="bi bi-star"></i> Reviews
            </a>

            <a href="../users/index.html"
               class="nav-link-admin active">
                <i class="bi bi-people"></i> Users
            </a>

            <div class="nav-group-label">System</div>

            <a href="../settings.html"
               class="nav-link-admin">
                <i class="bi bi-gear"></i> Settings
            </a>

        </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-content">
        <div class="top-navbar">
            <h5 class="page-title">Edit User</h5>
            <div class="d-flex align-items-center gap-3">
                <a href="../../index.html" target="_blank" class="text-decoration-none" style="color: var(--gray); font-size: 13px;">
                    <i class="bi bi-globe me-1"></i> Visit Website
                </a>

                <div class="btn-logout-form">
                    <button type="button" class="btn-logout" id="adminLogout" data-href="../login.html">
                        <i class="bi bi-box-arrow-right"></i> Logout
                    </button>
                </div>

                <div class="top-avatar">A</div>
            </div>
        </div>

        <div class="p-4">
<div class="container-fluid">
    <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
            <h5 class="mb-0">
                <i class="bi bi-pencil-square me-2"></i>Edit User: Sara Khan
            </h5>
            <a href="index.html" class="btn btn-secondary btn-sm">
                <i class="bi bi-arrow-left me-1"></i> Back
            </a>
        </div>
        <div class="card-body">
            <form data-mock="User updated (demo only — nothing is stored)." data-redirect="index.html">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Full Name <span class="text-danger">*</span></label>
                        <input type="text" name="user_name" class="form-control" value="Sara Khan" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Email Address <span class="text-danger">*</span></label>
                        <input type="email" name="user_email" class="form-control" value="sara@gmail.com" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Phone</label>
                        <input type="text" name="user_phone" class="form-control" value="03109876543">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Role <span class="text-danger">*</span></label>
                        <select name="user_role" class="form-control" required>
                            <option value="user" selected>User</option><option value="admin">Admin</option>
                        </select>
                    </div>
                    <div class="col-md-12 mb-3">
                        <label class="form-label">Address</label>
                        <textarea name="user_address" class="form-control" rows="2">Lahore</textarea>
                    </div>
                </div>

                <div class="mt-3">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-lg me-1"></i> Update User
                    </button>
                    <a href="index.html" class="btn btn-secondary">
                        <i class="bi bi-x-lg me-1"></i> Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script src="../../assets/js/admin.js"></script>
</body>
