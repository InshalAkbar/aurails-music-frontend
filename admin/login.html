<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURAILS — Admin Login</title>
    <link rel="icon" href="../favicon.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/pages/admin_login.css">
</head>
<body data-page="admin-login">

    <div class="bg-slider">
        <div class="bg-slide" style="background-image: url('../assets/storage/artists/atif-aslam.jpg');"></div>
        <div class="bg-slide" style="background-image: url('../assets/storage/artists/taylor-swift.jpg');"></div>
        <div class="bg-slide" style="background-image: url('../assets/storage/artists/billie-eilish.jpg');"></div>
        <div class="bg-slide" style="background-image: url('../assets/storage/artists/arijit-singh.jpg');"></div>
        <div class="bg-slide" style="background-image: url('../assets/storage/artists/ed-sheeran.jpg');"></div>
    </div>
    <div class="bg-overlay"></div>
    <div class="bg-grid"></div>

    <a href="../index.html" class="back-home">
        <i class="fa-solid fa-arrow-left"></i> <span>Back to Home</span>
    </a>

    <div class="admin-badge">
        <i class="fa-solid fa-shield-halved"></i> Admin Access
    </div>

    <div class="login-card">

        <div class="brand">
            <div class="brand-logo">
                <div class="brand-wave">
                    <span></span><span></span><span></span><span></span><span></span>
                </div>
                <span>AURAILS</span>
            </div>
        </div>

        <h2 class="login-title">Admin Sign In</h2>
        <p class="login-sub">Restricted access — authorized personnel only</p>

        <div style="height: 22px;"></div>

        <form id="adminLoginForm" data-mock="Signed in (demo)." data-redirect="dashboard.html">
            <div class="form-group">
                <label class="form-label">Email Address</label>
                <div class="input-wrap">
                    <i class="fa-solid fa-envelope input-icon"></i>
                    <input type="email" name="email" class="form-input" placeholder="admin@aurails.com" required autofocus>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <div class="input-wrap">
                    <i class="fa-solid fa-lock input-icon"></i>
                    <input type="password" name="password" class="form-input" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn-login">
                <span><i class="fa-solid fa-shield-halved me-1"></i> Login to Dashboard</span>
            </button>
        </form>

        <div class="protected-note">
            <i class="fa-solid fa-lock"></i>
            <span>Protected by Aurails Security</span>
        </div>
    </div>

    <script src="../assets/js/data.js"></script>
    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/admin.js"></script>
</body>
</html>
