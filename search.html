<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURAILS — Search</title>
    <meta name="description" content="AURAILS — Stream music, discover artists, explore albums and videos.">
    <meta name="theme-color" content="#08111A">
    <link rel="icon" href="favicon.ico">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">

    <script>
        (function () {
            var theme = localStorage.getItem('aurails-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>

    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/pages/search.css">
</head>
<body data-page="search">

    <div class="bg-layer bg-glow"></div>
    <div class="bg-layer bg-grid"></div>

    <div class="mobile-overlay" id="mobileOverlay"></div>

    <nav class="navbar-custom">
        <div class="nav-left">
            <a href="index.html" class="brand">
                <div class="brand-wave">
                    <span></span><span></span><span></span><span></span><span></span>
                </div>
                <span>AURAILS</span>
            </a>

            <ul class="nav-menu" id="navMenu">
                <li><a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i> Home</a></li>
                <li><a href="music.html" class="nav-item"><i class="fa-solid fa-music"></i> Music</a></li>
                <li><a href="artists.html" class="nav-item"><i class="fa-solid fa-microphone"></i> Artists</a></li>
                <li><a href="albums.html" class="nav-item"><i class="fa-solid fa-compact-disc"></i> Albums</a></li>
                <li><a href="videos.html" class="nav-item"><i class="fa-solid fa-play"></i> Videos</a></li>
                <li data-auth="user" hidden><a href="favorites.html" class="nav-item"><i class="fa-solid fa-heart"></i> Favorites</a></li>
            </ul>
        </div>

        <div class="nav-right">
            <form class="search-wrap" id="searchForm" autocomplete="off">
                <input type="text" name="q" class="search-input" placeholder="Search...">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <button type="button" class="search-clear" id="searchClear" hidden>
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </form>

            <button class="theme-toggle" id="themeToggle" title="Toggle theme">
                <i class="fa-solid fa-moon" id="themeIcon"></i>
            </button>

            <span class="nav-guest" data-auth="guest">
                <a href="user-login.html" class="btn-ghost">
                    <i class="fa-solid fa-right-to-bracket"></i> <span class="d-none d-md-inline">Login</span>
                </a>
                <a href="user-register.html" class="btn-primary-glow">
                    <i class="fa-solid fa-user-plus"></i> <span class="d-none d-md-inline">Register</span>
                </a>
            </span>
            <span class="nav-user" data-auth="user" hidden>
                <a href="profile.html" class="user-chip" id="userChip">
                    <div class="user-avatar" id="userAvatar">U</div>
                    <span id="userName">User</span>
                </a>
                <button type="button" class="logout-btn-icon" id="logoutBtn" title="Logout">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </button>
            </span>

            <button class="burger" id="burger">
                <i class="fa-solid fa-bars" id="burgerIcon"></i>
            </button>
        </div>
    </nav>

    <main class="page-wrapper">
<section class="page-header" id="searchHeader">
    <div class="page-tag">
        <i class="fa-solid fa-magnifying-glass"></i> Search Results
    </div>
    <h1 class="page-title" id="searchTitle">Search <span class="page-gradient">Aurails</span></h1>
    <p class="page-desc" id="searchDesc">Find your favorite tracks, artists, albums, and videos.</p>
</section>

<div id="searchResults"></div>
    </main>

    <div class="player" id="player">
        <div class="player-track">
            <div class="player-art"><i class="fa-solid fa-music"></i></div>
            <div class="player-meta">
                <div class="player-title">Midnight Frequencies</div>
                <div class="player-artist">Neon Collective</div>
            </div>
        </div>
        <div class="player-center">
            <div class="player-controls">
                <button><i class="fa-solid fa-shuffle"></i></button>
                <button><i class="fa-solid fa-backward-step"></i></button>
                <button class="player-play" id="playerPlay"><i class="fa-solid fa-play"></i></button>
                <button><i class="fa-solid fa-forward-step"></i></button>
                <button><i class="fa-solid fa-repeat"></i></button>
            </div>
            <div class="player-progress">
                <span>1:24</span>
                <div class="player-bar"><div class="player-bar-fill"></div></div>
                <span>3:45</span>
            </div>
        </div>
        <div class="player-right">
            <div class="player-wave"><span></span><span></span><span></span><span></span><span></span></div>
            <i class="fa-solid fa-heart liked"></i>
            <i class="fa-solid fa-volume-high"></i>
        </div>
    </div>

    <script src="assets/js/data.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/pages/search.js"></script>
</body>
</html>
